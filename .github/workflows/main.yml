name: Automatische News-Aktualisierung

on:
  schedule:
    - cron: '34,4 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-news-update-main
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Python initialisieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4

    - name: Scraper ausführen
      run: python fetch_news.py

    - name: Änderungen zurückschreiben
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot@users.noreply.github.com'
        git add news.json
        
        if git diff --staged --quiet; then
          echo "Keine Änderungen an news.json gefunden. Überspringe Commit."
          exit 0
        fi
        
        git commit -m "Automatisches Update der news.json"
        
        # Sicherstellen, dass der Branch aktuell ist und Konflikte/Race Conditions abgefangen werden
        for attempt in 1 2 3 4 5; do
          git fetch origin main || true
          git rebase origin/main || true
          if git push origin HEAD:main; then
            echo "Änderungen erfolgreich veröffentlicht."
            exit 0
          fi
          echo "Push fehlgeschlagen, Versuch $attempt von 5..."
          sleep 3
        done
        
        echo "Push nach 5 Versuchen fehlgeschlagen."
        exit 1
